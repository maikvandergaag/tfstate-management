name: Validate Terraform on PR

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - '.github/workflows/terraform-validate-pr.yml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.5.0

      - uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2

      - name: Terraform Format Check
        id: fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        working-directory: ./terraform
        run: |
          terraform init -backend=false
        continue-on-error: false

      - name: Terraform Validate
        id: validate
        working-directory: ./terraform
        run: terraform validate -no-color
        continue-on-error: true
      
      - name: TFLint
        id: tflint
        working-directory: ./terraform
        continue-on-error: true
        run: |
          tflint --init
          tflint -f compact

      - name: Post Results Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### 🖌 Terraform Format and Style 
            * \`${{ steps.fmt.outcome }}\`

            
            #### ⚙️ Terraform Initialization 
            * \`${{ steps.init.outcome }}\`

            #### 🤖 Terraform Validation 
            * \`${{ steps.validate.outcome }}\`
            
            #### 🔍 Terraform Linting 
            * \`${{ steps.tflint.outcome }}\`
            
            <details><summary>Show Validation Details</summary>

            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if validation failed
        if: steps.fmt.outcome == 'failure' || steps.init.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.tflint.outcome == 'failure'
        run: |
          echo "::error::Terraform validation failed. Please check the details above."
          exit 1

      - name: Success Summary
        if: steps.fmt.outcome == 'success' && steps.init.outcome == 'success' && steps.validate.outcome == 'success' && steps.tflint.outcome == 'success'
        run: |
          echo "✅ All Terraform validation checks passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Format: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Init: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Validate: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Linting: ✅ Passed" >> $GITHUB_STEP_SUMMARY